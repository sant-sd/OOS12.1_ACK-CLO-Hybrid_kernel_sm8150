name: Build NetHunter OOS12 - OnePlus 7T

on:
  push:
    branches: [ "thirteen" ]
  pull_request:
    branches: [ "thirteen" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVICE: OnePlus7T
      ARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: thirteen

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm zip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export O=out
          export ARCH=arm64
          export SUBARCH=arm64

          if [ -f drivers/gpu/drm/msm/oplus/oplus_dc_diming.c ]; then
            sed -i 's/extern oplus_dc_v2_on;/extern int oplus_dc_v2_on;/g' drivers/gpu/drm/msm/oplus/oplus_dc_diming.c
          fi
          
          find drivers/soc/oplus -name "*.c" | xargs sed -i 's/asm\/uaccess.h/linux\/uaccess.h/g' || true
          find . -name "Makefile" -o -name "*.mk" | xargs sed -i 's/-Werror//g'
          find . -name "Makefile" -o -name "*.mk" | xargs sed -i 's/-Wfatal-errors//g'
          find . -name "Makefile" -o -name "*.mk" | xargs sed -i 's/-implicit-function-declaration//g'

          make ${{ env.KERNEL_DEFCONFIG }} O=$O
          
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' $O/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> $O/.config
          
          make O=$O olddefconfig

          make -j$(nproc) O=$O \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            WERROR=0 \
            KCFLAGS="-w" \
            CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/
          fi

      - name: Create Flashable ZIP
        run: |
          cd anykernel
          zip -r ../NetHunter-Kernel-OOS12-${{ env.DEVICE }}.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-OnePlus7T
          path: NetHunter-Kernel-OOS12-${{ env.DEVICE }}.zip

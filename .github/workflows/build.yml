name: Build OOS12 Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEVICE: OnePlus7T
  ARCH: arm64
  KERNEL_DEFCONFIG: vendor/sm8150_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  O: out

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang lld git bc flex bison libssl-dev zip unzip python3 python3-pip wget p7zip-full
          export PATH=$PATH:/usr/bin

      - name: Upload partitions
        uses: actions/upload-artifact@v4
        with:
          name: partitions
          path: |
            boot.emmc.win
            dtbo.emmc.win
            modem.emmc.win
            recovery.emmc.win

      - name: Extract boot for ramdisk
        run: |
          mkdir -p partitions_extracted
          7z x boot.emmc.win -opartitions_extracted -y
          magiskboot unpack partitions_extracted/boot.img
          mv ramdisk.cpio ramdisk.img
          mv dtbo.img dtbo.img

      - name: Prepare kernel
        run: |
          mkdir -p $O
          make $KERNEL_DEFCONFIG O=$O
          make -j$(nproc) O=$O \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE

      - name: Repack boot.img
        run: |
          mkdir -p final_images
          cp $O/arch/arm64/boot/Image.gz-dtb final_images/kernel.img
          cp dtbo.img final_images/
          magiskboot repack boot.img
          mv boot.img final_images/

      - name: Create flashable ZIP
        run: |
          mkdir -p flashable
          cp final_images/boot.img flashable/
          cp final_images/dtbo.img flashable/
          echo "ui_print('Installing custom kernel');" > flashable/META-INF/com/google/android/updater-script
          zip -r final_flashable.zip flashable/*

      - name: Create fastboot images
        run: |
          mkdir -p fastboot
          cp final_images/boot.img fastboot/
          cp final_images/dtbo.img fastboot/
          cp modem.emmc.win fastboot/modem.img || true
          cp recovery.emmc.win fastboot/recovery.img || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            final_images/*
            final_flashable.zip
            fastboot/*
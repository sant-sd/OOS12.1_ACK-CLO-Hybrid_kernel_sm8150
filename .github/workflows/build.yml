name: Build OnePlus7T OOS12 Kernel + NetHunter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVICE: OnePlus7T
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: sm8150_defconfig
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm zip \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Prepare Build Directory
        run: |
          export O=out
          mkdir -p $O

      - name: Build Kernel
        run: |
          export O=out
          make O=$O $KERNEL_DEFCONFIG
          make -j$(nproc) O=$O \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE

      - name: Package Boot.img
        run: |
          mkdir -p artifact
          cp out/arch/arm64/boot/Image.gz-dtb artifact/boot.img

      - name: Create Flashable ZIP for TWRP/OrangeFox
        run: |
          mkdir -p artifact/KERNEL
          cp out/arch/arm64/boot/Image.gz-dtb artifact/KERNEL/boot.img
          echo "ui_print('OnePlus7T Kernel');" > artifact/updater-script
          cd artifact && zip -r OnePlus7T-Kernel.zip * && cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus7T-Kernel-Files
          path: |
            artifact/boot.img
            artifact/OnePlus7T-Kernel.zip
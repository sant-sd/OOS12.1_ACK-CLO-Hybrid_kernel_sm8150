name: Build NetHunter OOS12 - OnePlus 7T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVICE: OnePlus7T
      ARCH: arm64
      KERNEL_DEFCONFIG: vendor/sm8150-perf_defconfig
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm zip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export O=out
          export ARCH=arm64
          export SUBARCH=arm64
          
          make ${{ env.KERNEL_DEFCONFIG }} O=$O

          # أضفنا KCFLAGS="-Wno-error" لتجاوز الخطأ الذي حدث
          make -j$(nproc) O=$O \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/ || cp out/arch/arm64/boot/Image anykernel/

      - name: Create Flashable ZIP
        run: |
          cd anykernel
          zip -r ../NetHunter-OOS12-${{ env.DEVICE }}.zip *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-OOS12-${{ env.DEVICE }}
          path: NetHunter-OOS12-${{ env.DEVICE }}.zip
